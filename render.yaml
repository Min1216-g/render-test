services:
  - type: web
    name: market-scanner-api
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt && python -m compileall -q server.py render_mobile_refresh.py render_cron_runner.py
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: MARKET_API_TOKEN
        sync: false
      - key: MARKET_RESULTS_FILE
        value: market_scanner_results.csv
      - key: MARKET_RATE_LIMIT_PER_MINUTE
        value: "90"
      - key: MARKET_RESULTS_CACHE_TTL
        value: "20"
      - key: MARKET_ALLOW_UNAUTH_HEALTH
        value: "true"
      - key: MARKET_ENABLE_FULL_SCANNER
        value: "true"
      - key: MARKET_SCANNER_REFRESH_SCRIPT
        value: render_mobile_refresh.py
      - key: MARKET_SCANNER_REFRESH_TIMEOUT
        value: "3000"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONPYCACHEPREFIX
        value: "/tmp/market-pycache"
      - key: XDG_CACHE_HOME
        value: "/tmp/market-cache"
      - key: MPLCONFIGDIR
        value: "/tmp/market-mpl"

  - type: cron
    name: market-scanner-vancouver-schedule
    runtime: python
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt && python -m compileall -q render_cron_runner.py render_mobile_refresh.py
    startCommand: python render_cron_runner.py --mode auto
    schedule: "0 23,0,1 * * *"
    envVars:
      - key: MARKET_API_TOKEN
        sync: false
      - key: MARKET_SCANNER_REMOTE_UPLOAD_URL
        value: https://market-scanner-api-fo2m.onrender.com/api/results/upload
      - key: MARKET_RESULTS_FILE
        value: market_scanner_results.csv
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONPYCACHEPREFIX
        value: "/tmp/market-pycache"
      - key: XDG_CACHE_HOME
        value: "/tmp/market-cache"
      - key: MPLCONFIGDIR
        value: "/tmp/market-mpl"
